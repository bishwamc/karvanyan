<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140f1e">
  <meta name="description" content="Kārvānyān of Sadak-e-Azam: The Long Road East. A retro arcade caravan game on the Grand Trunk Road, Kabul to Dhaka, 1665.">
  <title>Kārvānyān of Sadak-e-Azam: The Long Road East</title>
  <!-- Inline SVG favicon: no external file, no request. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23140f1e'/%3E%3Crect x='2' y='9' width='12' height='3' fill='%23f2b84b'/%3E%3Crect x='4' y='5' width='3' height='4' fill='%23f2b84b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <a class="skip-link" href="#screen">Skip to the game</a>

  <div id="app">
    <!-- Status messages from game actions ("Not enough rupees."). -->
    <div id="notice" role="status" aria-live="polite"></div>
    <!-- Every screen is rendered into this element by js/ui.js. -->
    <div id="screen" tabindex="-1"></div>
    <div id="save-indicator" class="save-indicator" role="status" aria-live="polite"></div>
  </div>

  <!-- Dialogs and bottom sheets live outside #app so the rest of the page can be made inert. -->
  <div id="modal-root"></div>

  <noscript>
    <p class="noscript">This game needs JavaScript. Please enable it and reload the page.</p>
  </noscript>

  <!-- Classic scripts in dependency order. They share one namespace: window.Karvanyan. -->
  <script src="./js/config.js" defer></script>
  <script src="./js/world.js" defer></script>
  <script src="./js/content.js" defer></script>
  <script src="./js/state.js" defer></script>
  <script src="./js/engine.js" defer></script>
  <script src="./js/events.js" defer></script>
  <script src="./js/ui.js" defer></script>
  <script src="./js/game.js" defer></script>
</body>
</html>
