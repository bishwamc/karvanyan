<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1e6cf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14233a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Kārvānyān of Sadak-e-Azam: The Long Road East. A merchant-caravan game on the Grand Trunk Road, Kabul to Dhaka, 1665.">
  <title>Kārvānyān of Sadak-e-Azam: The Long Road East</title>
  <!-- Inline SVG favicon (an inked seal): no external file, no request. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f1e6cf'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23a63a24' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23a63a24'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/style.css?v=2.5.0">
</head>
<body>
  <a class="skip-link" href="#screen">Skip to the game</a>

  <div id="app">
    <!-- Status messages from game actions ("Not enough rupees."). -->
    <div id="notice" role="status" aria-live="polite"></div>
    <!-- Every screen is rendered into this element by js/ui.js. -->
    <div id="screen" tabindex="-1"></div>
    <div id="save-indicator" class="save-indicator" role="status" aria-live="polite"></div>
  </div>

  <!-- Dialogs and bottom sheets live outside #app so the rest of the page can be made inert. -->
  <div id="modal-root"></div>

  <noscript>
    <p class="noscript">This game needs JavaScript. Please enable it and reload the page.</p>
  </noscript>

  <!-- Classic scripts in dependency order. They share one namespace: window.Karvanyan. -->
  <script src="./js/config.js?v=2.5.0" defer></script>
  <script src="./js/world.js?v=2.5.0" defer></script>
  <script src="./js/content.js?v=2.5.0" defer></script>
  <script src="./js/state.js?v=2.5.0" defer></script>
  <script src="./js/engine.js?v=2.5.0" defer></script>
  <script src="./js/events.js?v=2.5.0" defer></script>
  <script src="./js/ui.js?v=2.5.0" defer></script>
  <script src="./js/game.js?v=2.5.0" defer></script>
</body>
</html>
